e that feels good to live in every day, <span class=\"accent\">not just in photos.<\/span><\/p><\/blockquote>\n        <figcaption class=\"label muted\">— Bún<\/figcaption>\n      <\/figure>\n    <\/div>\n    <div class=\"rent__price\">\n      <p class=\"chapter-marker label muted\">&nbsp;&#x309; 03 · to stay a long while<\/p>\n      <p class=\"chapter-word\" lang=\"vi\">ở lâu<\/p>\n      <h2 id=\"rent-heading\">The <span class=\"accent\">rent<\/span><\/h2>\n      <div class=\"rent__line-block reveal\"><p class=\"rent__line big\">From 13–14 <span class=\"accent\">million<\/span> VND <span class=\"accent\">a month<\/span><\/p><\/div>\n      \n      <div class=\"rent__terms-block reveal\">\n        <ul class=\"rent__terms\">\n          <li>Whole house, by the month<\/li>\n          <li>Minimum stay one month<\/li>\n          <li>Two months' deposit<\/li>\n          <li>Included each month: up to 300 kWh of electricity and 10 m³ of water. Anything above is charged at the official rate.<\/li>\n          <li>I take care of temporary residence registration for you<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<section id=\"faq\" class=\"chapter chapter--faq\" aria-labelledby=\"faq-heading\">\n  <div class=\"faq-side reveal\">\n    <div class=\"faq-side__head\">\n      <p class=\"chapter-marker label muted\">&nbsp;&#x309; 04 · questions<\/p>\n      <h2 id=\"faq-heading\">FAQ<\/h2>\n    <\/div>\n    <div class=\"faq-side__invite\">\n      <p class=\"faq-side__line\">Hi, I&#x27;m Bún. <span class=\"accent\">I usually reply within an hour.<\/span><\/p>\n      \n\n    <\/div>\n  <\/div>\n  <div class=\"faq-list reveal\">\n    <details class=\"faq-item\" name=\"faq\" open>\n      <summary>What is the minimum stay?<\/summary>\n      <p>One month.<\/p>\n    <\/details>\n    <details class=\"faq-item\" name=\"faq\">\n      <summary>Can I rent a room, not the whole house?<\/summary>\n      <p>No. The house is rented whole.<\/p>\n    <\/details>\n    <details class=\"faq-item\" name=\"faq\">\n      <summary>How much is the rent?<\/summary>\n      <p>From 13–14 million VND a month.<\/p>\n    <\/details>\n    <details class=\"faq-item\" name=\"faq\">\n      <summary>How much is the deposit?<\/summary>\n      <p>Two months' rent.<\/p>\n    <\/details>\n    <details class=\"faq-item\" name=\"faq\">\n      <summary>Are electricity and water included?<\/summary>\n      <p>Up to 300 kWh of electricity and 10 m³ of water each month. Anything above is charged at the official rate.<\/p>\n    <\/details>\n    <details class=\"faq-item\" name=\"faq\">\n      <summary>Can I bring a pet?<\/summary>\n      <p>Let's talk. Tell me about your pet.<\/p>\n    <\/details>\n    <details class=\"faq-item\" name=\"faq\">\n      <summary>Do you help with temporary residence registration?<\/summary>\n      <p>Yes. I take care of temporary residence registration for you.<\/p>\n    <\/details>\n    <details class=\"faq-item\" name=\"faq\">\n      <summary>Can I visit before I decide?<\/summary>\n      <p>Yes. Send me a message and we'll find a time.<\/p>\n    <\/details>\n  <\/div>\n<\/section>\n\n\n<section id=\"contact\" class=\"chapter chapter--contact band\" aria-labelledby=\"contact-heading\">\n  <p class=\"chapter-marker label\">&nbsp;&#x309; 05<\/p>\n  <p class=\"chapter-word\" lang=\"vi\">ở lại?<\/p>\n  <div class=\"contact__row reveal\">\n    <div class=\"contact__lead\">\n      <h2 id=\"contact-heading\">Will you <span class=\"accent\">stay?<\/span><\/h2>\n      <p class=\"contact__line\">Hi, I&#x27;m Bún. <span class=\"accent\">I usually reply within an hour.<\/span><\/p>\n    <\/div>\n    <p class=\"contact__empty\">Contact details are on their way.<\/p>\n  <\/div>\n<\/section>\n\n\n\n\n\n<\/main>\n  <footer class=\"site-footer\">\n  <div class=\"site-footer__inner\">\n    <p class=\"site-footer__name\"><span class=\"site-footer__mark\">Ở<\/span> a word for staying · Hòa Xuân, Đà Nẵng<\/p>\n    <p class=\"site-footer__preview\ e), calc((100% - var(--content-max)) / 2 + var(--side)));\n  right: max(var(--side), calc((100% - var(--content-max)) / 2 + var(--side)));\n  margin: 0;\n}\n\nhtml.hero-flight .hero__foot {\n  bottom: 44px;\n  opacity: var(--hero-foot);\n}\n\nhtml.hero-flight .hero__cue {\n  position: absolute;\n  right: max(var(--side), calc((100% - var(--content-max)) / 2 + var(--side)));\n  bottom: var(--space-3);\n  margin: 0;\n  color: var(--paper);\n  opacity: var(--hero-cue);\n}\n\nhtml.hero-flight .hero__title {\n  bottom: var(--space-6);\n  color: var(--paper);\n  opacity: var(--hero-title);\n  pointer-events: none;\n}\n\n/* Two lines, \"Living\" on the left and \"with nature\" on the right, at 150px capitals (60px on\n   phones); hero.js puts each line in a .hero__ln and moves it up from hidden. */\nhtml.hero-flight .hero__title h1 {\n  display: flex;\n  flex-direction: column;\n  font-size: calc(var(--size-headline) / 0.7) !important;\n}\n\nhtml.hero-flight .hero__ln {\n  display: block;\n  overflow: hidden;\n  padding: 0.04em 0 0.06em;\n}\n\nhtml.hero-flight .hero__ln > span {\n  display: block;\n}\n\nhtml.hero-flight .hero__ln:last-child {\n  align-self: flex-end;\n}\n\n/* Phones */\n\n@media (max-width: 760px) {\n  :root {\n    --size-headline: 60px;\n    --size-chapter: 96px;\n    --size-big: 44px;\n    --size-gloss: 22px;\n    --size-hero-line: 20px;\n    --size-quote: 22px;\n    --section-gap: 72px;\n    --side: 18px;\n  }\n\n  .chapter h2 {\n    font-size: calc(40px / 0.7);\n  }\n\n  .nav-row {\n    display: none;\n  }\n\n  .nav-menu {\n    display: block;\n  }\n\n  .button {\n    width: 100%;\n  }\n}\n\n/* Reduced motion: no colour transition, no video plays, the poster photo shows instead. */\n\n@media (prefers-reduced-motion: reduce) {\n  body {\n    transition: none;\n  }\n\n  .media video {\n    display: none;\n  }\n\n  .media__poster {\n    display: block;\n  }\n}\n\n<\/style>\n  \n  <style>\n/* Load and reveal motion (design.md, \"Load and reveal motion\").\n\n   Every rule needs the class \"motion\" on <html>, set by js/reveal.js only when the visitor has\n   not asked for less motion. Without the script, or under reduced motion, everything shows at\n   once, with no transform and no animation. */\n\n@media (prefers-reduced-motion: no-preference) {\n  /* The header fades in and moves 12px down into place. \"backwards\" leaves no end state, so the\n     hero script can still move the header once this is done. */\n  html.motion .site-header {\n    animation: motion-header-in 0.9s ease-out 0.2s backwards;\n  }\n\n  @keyframes motion-header-in {\n    from {\n      opacity: 0;\n      transform: translateY(-12px);\n    }\n\n    to {\n      opacity: 1;\n      transform: none;\n    }\n  }\n\n  /* A block of a chapter waits 42px lower, hidden, until 12% of it is on screen. */\n  html.motion .reveal {\n    opacity: 0;\n    transform: translateY(42px);\n    transition:\n      opacity 1.1s cubic-bezier(0.2, 0.7, 0.2, 1),\n      transform 1.1s cubic-bezier(0.2, 0.7, 0.2, 1);\n  }\n\n  html.motion .reveal.is-revealed {\n    opacity: 1;\n    transform: none;\n  }\n\n  /* On screen when the page opens: shown at once. */\n  html.motion .reveal.is-revealed-now {\n    transition: none;\n  }\n\n  /* Photos in media slots zoom slowly, clipped by the slot (overflow: hidden in site.css). */\n  html.motion .media__box img {\n    animation: motion-zoom 22s ease-in-out infinite alternate;\n  }\n\n  @keyframes motion-zoom {\n    from {\n      transform: scale(1.02);\n    }\n\n    to {\n      transform: scale(1.09);\n    }\n  }\n}\n\n<\/style>\n  \n<\/head>\n<body data-daypart=\"day\">\n  <header class=\"site-header\">\n  <div class=\"site-header__row\">\n    <div class=\"site-header__left\">\n      <a class=\"wordmark\" href=\"/\">Ở<\/a>\n      <span class=\"site-header__time label\" data-now=\"1794556347636\" data-preview>It's 14:52 in Hòa Xuân · Day<\/span>\n    <\/div>\n    <nav class=\"nav-row\" aria-label=\"Main\">\n      <ul class=\"nav-l ont-weight: bold;\n    margin-top: 4px;\n}\n\ndd {\n    margin-left: 0;\n}\n\nform {\n    margin: 0;\n    padding: 0;\n}\n\nfieldset {\n    margin: 0;\n    min-width: 0;\n    padding: 0;\n    border: none;\n    border-top: 1px solid var(--hairline-color);\n}\n\ndetails summary {\n    cursor: pointer;\n}\n\nblockquote {\n    font-size: 0.6875rem;\n    color: #777;\n    margin-left: 2px;\n    padding-left: 10px;\n    border-left: 5px solid #ddd;\n}\n\ncode, pre {\n    font-family: var(--font-family-monospace);\n    color: var(--body-quiet-color);\n    font-size: 0.75rem;\n    overflow-x: auto;\n}\n\npre.literal-block {\n    margin: 10px;\n    background: var(--darkened-bg);\n    padding: 6px 8px;\n}\n\ncode strong {\n    color: #930;\n}\n\nhr {\n    clear: both;\n    color: var(--hairline-color);\n    background-color: var(--hairline-color);\n    height: 1px;\n    border: none;\n    margin: 0;\n    padding: 0;\n    line-height: 1px;\n}\n\n/* TEXT STYLES & MODIFIERS */\n\n.small {\n    font-size: 0.6875rem;\n}\n\n.mini {\n    font-size: 0.625rem;\n}\n\n.help, p.help, form p.help, div.help, form div.help, div.help li {\n    font-size: 0.6875rem;\n    color: var(--body-quiet-color);\n}\n\ndiv.help ul {\n     margin-bottom: 0;\n}\n\n.help-tooltip {\n    cursor: help;\n}\n\np img, h1 img, h2 img, h3 img, h4 img, td img {\n    vertical-align: middle;\n}\n\n.quiet, a.quiet:link, a.quiet:visited {\n    color: var(--body-quiet-color);\n    font-weight: normal;\n}\n\n.clear {\n    clear: both;\n}\n\n.nowrap {\n    white-space: nowrap;\n}\n\n.hidden {\n    display: none !important;\n}\n\n/* TABLES */\n\ntable {\n    border-collapse: collapse;\n    border-color: var(--border-color);\n}\n\ntd, th {\n    font-size: 0.8125rem;\n    line-height: 1rem;\n    border-bottom: 1px solid var(--hairline-color);\n    vertical-align: top;\n    padding: 8px;\n}\n\nth {\n    font-weight: 500;\n    text-align: left;\n}\n\nthead th,\ntfoot td {\n    color: var(--body-quiet-color);\n    padding: 5px 10px;\n    font-size: 0.6875rem;\n    background: var(--body-bg);\n    border: none;\n    border-top: 1px solid var(--hairline-color);\n    border-bottom: 1px solid var(--hairline-color);\n}\n\ntfoot td {\n    border-bottom: none;\n    border-top: 1px solid var(--hairline-color);\n}\n\nthead th.required {\n    font-weight: bold;\n}\n\ntr.alt {\n    background: var(--darkened-bg);\n}\n\ntr:nth-child(odd), .row-form-errors {\n    background: var(--body-bg);\n}\n\ntr:nth-child(even),\ntr:nth-child(even) .errorlist,\ntr:nth-child(odd) + .row-form-errors,\ntr:nth-child(odd) + .row-form-errors .errorlist {\n    background: var(--darkened-bg);\n}\n\n/* SORTABLE TABLES */\n\nthead th {\n    padding: 5px 10px;\n    line-height: normal;\n    text-transform: uppercase;\n    background: var(--darkened-bg);\n}\n\nthead th a:link, thead th a:visited {\n    color: var(--body-quiet-color);\n}\n\nthead th.sorted {\n    background: var(--selected-bg);\n}\n\nthead th.sorted .text {\n    padding-right: 42px;\n}\n\ntable thead th .text span {\n    padding: 8px 10px;\n    display: block;\n}\n\ntable thead th .text a {\n    display: block;\n    cursor: pointer;\n    padding: 8px 10px;\n}\n\ntable thead th .text a:focus, table thead th .text a:hover {\n    background: var(--selected-bg);\n}\n\nthead th.sorted a.sortremove {\n    visibility: hidden;\n}\n\ntable thead th.sorted:hover a.sortremove {\n    visibility: visible;\n}\n\ntable thead th.sorted .sortoptions {\n    display: block;\n    padding: 9px 5px 0 5px;\n    float: right;\n    text-align: right;\n}\n\ntable thead th.sorted .sortpriority {\n    font-size: .8em;\n    min-width: 12px;\n    text-align: center;\n    vertical-align: 3px;\n    margin-left: 2px;\n    margin-right: 2px;\n}\n\ntable thead th.sorted .sortoptions a {\n    position: relative;\n    width: 14px;\n    height: 14px;\n    display: inline-block;\n    background: url(../img/sorting-icons.svg) 0 0 no-repeat;\n    background-size: 14px auto;\n}\n\ntable thead th.sorted .sortoptions a.sortremove {\n    background-position: 0 0;\n}\n\ntable thead th.sorted .sortoptions a.sortremove:after {\n    content: '\\\\';\n    position: absolute;\n    top: -6px;\n    left: 3px;\n    font-weight: 200;\n    font-size: 1.125rem;\n    color: var(--body-quiet-color);\n}\n\ntable thead th.sorted .sortoptions a.sortremove:focus:after,\ntable thead th.sorted .sortoptions a.sortremove:hover:after {\n    color: var(--link-fg);\n}\n\ntable thead th.sorted .sortoptions a.sortremove:focus,\ntable thead th.sorted .sortoptions a.sortremove:hover {\n    background-position: 0 -14px;\n}\n\ntable thead th.sorted .sortoptions a.ascending {\n    background-position: 0 -28px;\n}\n\ntable thead th.sorted .sortoptions a.ascending:focus,\ntable thead th.sorted .sortoptions a.ascending:hover {\n    background-position: 0 -42px;\n}\n\ntable thead th.sorted .sortoptions a.descending {\n    top: 1px;\n    background-position: 0 -56px;\n}\n\ntable thead th.sorted .sortoptions a.descending:focus,\ntable thead th.sorted .sortoptions a.descending:hover {\n    background-position: 0 -70px;\n}\n\n/* FORM DEFAULTS */\n\ninput, textarea, select, .form-row p, form .button {\n    margin: 2px 0;\n    padding: 2px 3px;\n    vertical-align: middle;\n    font-family: var(--font-family-primary);\n    font-weight: normal;\n    font-size: 0.8125rem;\n}\n.form-row div.help {\n    padding: 2px 3px;\n}\n\ntextarea {\n    vertical-align: top;\n}\n\n/*\nMinifiers remove the default (text) \"type\" attribute from \"input\" HTML tags.\nAdd input:not([type]) to make the CSS stylesheet work the same.\n*/\ninput:not([type]), input[type=text], input[type=password], input[type=email],\ninput[type=url], input[type=number], input[type=tel], textarea, select,\n.vTextField {\n    border: 1px solid var(--border-color);\n    border-radius: 4px;\n    padding: 5px 6px;\n    margin-top: 0;\n    color: var(--body-fg);\n    background-color: var(--body-bg);\n}\n\n/*\nMinifiers remove the default (text) \"type\" attribute from \"input\" HTML tags.\nAdd input:not([type]) to make the CSS stylesheet work the same.\n*/\ninput:not([type]):focus, input[type=text]:focus, input[type=password]:focus,\ninput[type=email]:focus, input[type=url]:focus, input[type=number]:focus,\ninput[type=tel]:focus, textarea:focus, select:focus, .vTextField:focus {\n    border-color: var(--body-quiet-color);\n}\n\nselect {\n    height: 1.875rem;\n}\n\nselect[multiple] {\n    /* Allow HTML size attribute to override the height in the rule above. */\n    height: auto;\n    min-height: 150px;\n}\n\n/* FORM BUTTONS */\n\n.button, input[type=submit], input[type=button], .submit-row input, a.button {\n    background: var(--button-bg);\n    padding: 10px 15px;\n    border: none;\n    border-radius: 4px;\n    color: var(--button-fg);\n    cursor: pointer;\n    transition: background 0.15s;\n}\n\na.button {\n    padding: 4px 5px;\n}\n\n.button:active, input[type=submit]:active, input[type=button]:active,\n.button:focus, input[type=submit]:focus, input[type=button]:focus,\n.button:hover, input[type=submit]:hover, input[type=button]:hover {\n    background: var(--button-hover-bg);\n}\n\n.button[disabled], input[type=submit][disabled], input[type=button][disabled] {\n    opacity: 0.4;\n}\n\n.button.default, input[type=submit].default, .submit-row input.default {\n    border: none;\n    font-weight: 400;\n    background: var(--default-button-bg);\n}\n\n.button.default:active, input[type=submit].default:active,\n.button.default:focus, input[type=submit].default:focus,\n.button.default:hover, input[type=submit].default:hover {\n    background: var(--default-button-hover-bg);\n}\n\n.button[disabled].default,\ninput[type=submit][disabled].default,\ninput[type=button][disabled].default {\n    opacity: 0.4;\n}\n\n\n/* MODULES */\n\n.module {\n    border: none;\n    margin-bottom: 30px;\n    background: var(--body-bg);\n}\n\n.module p, .module ul, .module h3, .module h4, .module dl, .module pre {\n    padding-left: 10px;\n    padding-right: 10px;\n}\n\n.module blockquote {\n    margin-left: 12px;\n}\n\n.module ul, .module ol {\n    margin-left: 1.5em;\n}\n\n.module h3 {\n    margin-top: .6em;\n}\n\n.module h2, .module caption, .inline-group h2 {\n    margin: 0;\n    padding: 8px;\n    font-weight: 400;\n    font-size: 0.8125rem;\n    text-align: left;\n    background: var(--header-bg);\n    color: var(--header-link-color);\n}\n\n.module caption,\n.inline-group h2 {\n    font-size: 0.75rem;\n    letter-spacing: 0.5px;\n    text-transform: uppercase;\n}\n\n.module table {\n    border-collapse: collapse;\n}\n\n/* MESSAGES & ERRORS */\n\nul.messagelist {\n    padding: 0;\n    margin: 0;\n}\n\nul.messagelist li {\n    display: block;\n    font-weight: 400;\n    font-size: 0.8125rem;\n    padding: 10px 10px 10px 65px;\n    margin: 0 0 10px 0;\n    background: var(--message-success-bg) url(../img/icon-yes.svg) 40px 12px no-repeat;\n    background-size: 16px auto;\n    color: var(--body-fg);\n    word-break: break-word;\n}\n\nul.messagelist li.warning {\n    background: var(--message-warning-bg) url(../img/icon-alert.svg) 40px 14px no-repeat;\n    background-size: 14px auto;\n}\n\nul.messagelist li.error {\n    background: var(--message-error-bg) url(../img/icon-no.svg) 40px 12px no-repeat;\n    background-size: 16px auto;\n}\n\n.errornote {\n    font-size: 0.875rem;\n    font-weight: 700;\n    display: block;\n    padding: 10px 12px;\n    margin: 0 0 10px 0;\n    color: var(--error-fg);\n    border: 1px solid var(--error-fg);\n    border-radius: 4px;\n    background-color: var(--body-bg);\n    background-position: 5px 12px;\n    overflow-wrap: break-word;\n}\n\nul.errorlist {\n    margin: 0 0 4px;\n    padding: 0;\n    color: var(--error-fg);\n    background: var(--body-bg);\n}\n\nul.errorlist li {\n    font-size: 0.8125rem;\n    display: block;\n    margin-bottom: 4px;\n    overflow-wrap: break-word;\n}\n\nul.errorlist li:first-child {\n    margin-top: 0;\n}\n\nul.errorlist li a {\n    color: inherit;\n    text-decoration: underline;\n}\n\ntd ul.errorlist {\n    margin: 0;\n    padding: 0;\n}\n\ntd ul.errorlist li {\n    margin: 0;\n}\n\n.form-row.errors {\n    margin: 0;\n    border: none;\n    border-bottom: 1px solid var(--hairline-color);\n    background: none;\n}\n\n.form-row.errors ul.errorlist li {\n    padding-left: 0;\n}\n\n.errors input, .errors select, .errors textarea,\ntd ul.errorlist + input, td ul.errorlist + select, td ul.errorlist + textarea {\n    border: 1px solid var(--error-fg);\n}\n\n.description {\n    font-size: 0.75rem;\n    padding: 5px 0 0 12px;\n}\n\n/* BREADCRUMBS */\n\ndiv.breadcrumbs {\n    background: var(--breadcrumbs-bg);\n    padding: 10px 40px;\n    border: none;\n    color: var(--breadcrumbs-fg);\n    text-align: left;\n}\n\ndiv.breadcrumbs a {\n    color: var(--breadcrumbs-link-fg);\n}\n\ndiv.breadcrumbs a:focus, div.breadcrumbs a:hover {\n    color: var(--breadcrumbs-fg);\n}\n\n/* ACTION ICONS */\n\n.viewlink, .inlineviewlink {\n    padding-left: 16px;\n    background: url(../img/icon-viewlink.svg) 0 1px no-repeat;\n}\n\n.hidelink {\n    padding-left: 16px;\n    background: url(../img/icon-hidelink.svg) 0 1px no-repeat;\n}\n\n.addlink {\n    padding-left: 16px;\n    background: url(../img/icon-addlink.svg) 0 1px no-repeat;\n}\n\n.changelink, .inlinechangelink {\n    padding-left: 16px;\n    background: url(../img/icon-changelink.svg) 0 1px no-repeat;\n}\n\n.deletelink {\n    padding-left: 16px;\n    background: url(../img/icon-deletelink.svg) 0 1px no-repeat;\n}\n\na.deletelink:link, a.deletelink:visited {\n    color: #CC3434; /* XXX Probably unused? */\n}\n\na.deletelink:focus, a.deletelink:hover {\n    color: #993333; /* XXX Probably unused? */\n    text-decoration: none;\n}\n\n/* OBJECT TOOLS */\n\n.object-tools {\n    font-size: 0.625rem;\n    font-weight: bold;\n    padding-left: 0;\n    float: right;\n    position: relative;\n    margin-top: -48px;\n}\n\n.object-tools li {\n    display: block;\n    float: left;\n    margin-left: 5px;\n    height: 1rem;\n}\n\n.object-tools a {\n    border-radius: 15px;\n}\n\n.object-tools a:link, .object-tools a:visited {\n    display: block;\n    float: left;\n    padding: 3px 12px;\n    background: var(--object-tools-bg);\n    color: var(--object-tools-fg);\n    font-weight: 400;\n    font-size: 0.6875rem;\n    text-transform: uppercase;\n    letter-spacing: 0.5px;\n}\n\n.object-tools a:focus, .object-tools a:hover {\n    background-color: var(--object-tools-hover-bg);\n}\n\n.object-tools a:focus{\n    text-decoration: none;\n}\n\n.object-tools a.viewsitelink, .object-tools a.addlink {\n    background-repeat: no-repeat;\n    background-position: right 7px center;\n    padding-right: 26px;\n}\n\n.object-tools a.viewsitelink {\n    background-image: url(../img/tooltag-arrowright.svg);\n}\n\n.object-tools a.addlink {\n    background-image: url(../img/tooltag-add.svg);\n}\n\n/* OBJECT HISTORY */\n\n#change-history table {\n    width: 100%;\n}\n\n#change-history table tbody th {\n    width: 16em;\n}\n\n#change-history .paginator {\n    color: var(--body-quiet-color);\n    border-bottom: 1px solid var(--hairline-color);\n    background: var(--body-bg);\n    overflow: hidden;\n}\n\n/* PAGE STRUCTURE */\n\n#container {\n    position: relative;\n    width: 100%;\n    min-width: 980px;\n    padding: 0;\n    display: flex;\n    flex-direction: column;\n    height: 100%;\n}\n\n#container > .main {\n    display: flex;\n    flex: 1 0 auto;\n}\n\n.main > .content {\n    flex:  1 0;\n    max-width: 100%;\n}\n\n.skip-to-content-link {\n    position: absolute;\n    top: -999px;\n    margin: 5px;\n    padding: 5px;\n    background: var(--body-bg);\n    z-index: 1;\n}\n\n.skip-to-content-link:focus {\n    left: 0px;\n    top: 0px;\n}\n\n#content {\n    padding: 20px 40px;\n}\n\n.dashboard #content {\n    width: 600px;\n}\n\n#content-main {\n    float: left;\n    width: 100%;\n}\n\n#content-related {\n    float: right;\n    width: 260px;\n    position: relative;\n    margin-right: -300px;\n}\n\n@media (forced-colors: active) {\n  #content-related {\n      border: 1px solid;\n  }\n}\n\n/* COLUMN TYPES */\n\n.colMS {\n    margin-right: 300px;\n}\n\n.colSM {\n    margin-left: 300px;\n}\n\n.colSM #content-related {\n    float: left;\n    margin-right: 0;\n    margin-left: -300px;\n}\n\n.colSM #content-main {\n    float: right;\n}\n\n.popup .colM {\n    width: auto;\n}\n\n/* HEADER */\n\n#header {\n    width: auto;\n    height: auto;\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    padding: 10px 40px;\n    background: var(--header-bg);\n    color: var(--header-color);\n}\n\n#header a:link, #header a:visited, #logout-form button {\n    color: var(--header-link-color);\n}\n\n#header a:focus , #header a:hover {\n    text-decoration: underline;\n}\n\n@media (forced-colors: active) {\n  #header {\n      border-bottom: 1px solid;\n  }\n}\n\n#branding {\n    display: flex;\n}\n\n#site-name {\n    padding: 0;\n    margin: 0;\n    margin-inline-end: 20px;\n    font-weight: 300;\n    font-size: 1.5rem;\n    color: var(--header-branding-color);\n}\n\n#site-name a:link, #site-name a:visited {\n    color: var(--accent);\n}\n\n#branding h2 {\n    padding: 0 10px;\n    font-size: 0.875rem;\n    margin: -8px 0 8px 0;\n    font-weight: normal;\n    color: var(--header-color);\n}\n\n#branding a:hover {\n    text-decoration: none;\n}\n\n#logout-form {\n    display: inline;\n}\n\n#logout-form button {\n    background: none;\n    border: 0;\n    cursor: pointer;\n    font-family: var(--font-family-primary);\n}\n\n#user-tools {\n    float: right;\n    margin: 0 0 0 20px;\n    text-align: right;\n}\n\n#user-tools, #logout-form button{\n    padding: 0;\n    font-weight: 300;\n    font-size: 0.6875rem;\n    letter-spacing: 0.5px;\n    text-transform: uppercase;\n}\n\n#user-tools a, #logout-form button {\n    border-bottom: 1px solid rgba(255, 255, 255, 0.25);\n}\n\n#user-tools a:focus, #user-tools r) => {\n            options.push({title: container.innerHTML, node: container});\n        });\n\n        function checkValue(event) {\n            let filterValue = event.target.value;\n            if (filterValue) {\n                filterValue = filterValue.toLowerCase();\n            }\n            if (event.key === 'Escape') {\n                filterValue = '';\n                event.target.value = ''; // clear input\n            }\n            let matches = false;\n            for (const o of options) {\n                let displayValue = '';\n                if (filterValue) {\n                    if (o.title.toLowerCase().indexOf(filterValue) === -1) {\n                        displayValue = 'none';\n                    } else {\n                        matches = true;\n                    }\n                }\n                // show/hide parent <TR>\n                o.node.parentNode.parentNode.style.display = displayValue;\n            }\n            if (!filterValue || matches) {\n                event.target.classList.remove('no-results');\n            } else {\n                event.target.classList.add('no-results');\n            }\n            sessionStorage.setItem('django.admin.navSidebarFilterValue', filterValue);\n        }\n\n        const nav = document.getElementById('nav-filter');\n        nav.addEventListener('change', checkValue, false);\n        nav.addEventListener('input', checkValue, false);\n        nav.addEventListener('keyup', checkValue, false);\n\n        const storedValue = sessionStorage.getItem('django.admin.navSidebarFilterValue');\n        if (storedValue) {\n            nav.value = storedValue;\n            checkValue({target: nav, key: ''});\n        }\n    }\n    window.initSidebarQuickFilter = initSidebarQuickFilter;\n    initSidebarQuickFilter();\n}\n\n<\/script>\n<\/body>\n<\/html>\n", "owner-home": "<!DOCTYPE html>\n\n<html lang=\"en\" dir=\"ltr\">\n<head>\n<title>Site administration | Ở admin<\/title>\n<style>\n/*\n <script>
"use strict";
// Where the media of src/static/media/ are, from this file.
var MEDIA = "../../src/static/media/";

// Every screen and state. doc: the rendered page; at: the chapter to open at; w: phone or desk.
var SCENARIOS = [
  {group: "Site · intro by time of day", id: "intro-day", title: "Home, intro · day (08:00–17:00)", doc: "home-day"},
  {group: "Site · intro by time of day", id: "intro-dawn", title: "Home, intro · dawn (05:00–08:00)", doc: "home-dawn"},
  {group: "Site · intro by time of day", id: "intro-dusk", title: "Home, intro · dusk (17:00–19:00)", doc: "home-dusk"},
  {group: "Site · intro by time of day", id: "intro-night", title: "Home, intro · night (19:00–05:00)", doc: "home-night"},
  {group: "Site · chapters", id: "house", title: "01 The house (collage, facts, walk through)", doc: "home-day", at: "house"},
  {group: "Site · chapters", id: "hoa-xuan", title: "02 Hòa Xuân band", doc: "home-day", at: "hoa-xuan"},
  {group: "Site · chapters", id: "rent", title: "03 The rent", doc: "home-day", at: "rent"},
  {group: "Site · chapters", id: "faq", title: "04 FAQ, two columns", doc: "home-day", at: "faq"},
  {group: "Site · chapters", id: "contact", title: "05 Contact · Will you stay?", doc: "home-day", at: "contact"},
  {group: "Site · chapters", id: "contact-night", title: "05 Contact at night", doc: "home-night", at: "contact"},
  {group: "Site · no contact channel yet", id: "rent-no-channel", title: "The rent, no buttons", doc: "home-no-channel", at: "rent"},
  {group: "Site · no contact channel yet", id: "faq-no-channel", title: "FAQ, greeting only", doc: "home-no-channel", at: "faq"},
  {group: "Site · no contact channel yet", id: "contact-no-channel", title: "Contact, details on their way", doc: "home-no-channel", at: "contact"},
  {group: "Site · phone", id: "intro-phone", title: "Phone · intro", doc: "home-day", w: "phone"},
  {group: "Site · phone", id: "house-phone", title: "Phone · the house", doc: "home-day", at: "house", w: "phone"},
  {group: "Site · phone", id: "rent-phone", title: "Phone · the rent and the contact bar", doc: "home-day", at: "rent", w: "phone"},
  {group: "Site · phone", id: "faq-phone", title: "Phone · FAQ (head, questions, greeting)", doc: "home-day", at: "faq", w: "phone"},
  {group: "Site · phone", id: "contact-phone", title: "Phone · contact", doc: "home-day", at: "contact", w: "phone"},
  {group: "Site · other pages", id: "not-found", title: "Page not found (404)", doc: "not-found"},
  {group: "Site · other pages", id: "not-found-phone", title: "Phone · page not found", doc: "not-found", w: "phone"},
  {group: "Owner · admin at /owner/", id: "owner-login", title: "Owner sign-in", doc: "owner-login"},
  {group: "Owner · admin at /owner/", id: "owner-home", title: "Admin index (Contact counts, Site settings)", doc: "owner-home"},
  {group: "Owner · admin at /owner/", id: "counter-report", title: "Contact counts report (214 views, 9 clicks)", doc: "counter-report"},
  {group: "Owner · admin at /owner/", id: "counter-report-empty", title: "Contact counts report · nothing counted yet", doc: "counter-report-empty"},
  {group: "Owner · admin at /owner/", id: "counter-report-phone", title: "Phone · contact counts report", doc: "counter-report", w: "phone"}
];

var DOCS = JSON.parse(document.getElementById("docs").textContent);
var pick = document.getElementById("pick");
var view = document.getElementById("view");
var stage = document.getElementById("stage");
var toastEl = document.getElementById("toast");
var current = null;
var phone = false;
var toastTimer = 0;

if (/[?&]bare\b/.test(location.search)) document.body.classList.add("bare");

var groups = {};
SCENARIOS.forEach(function (s) {
  if (!groups[s.group]) {
    groups[s.group] = document.createElement("optgroup");
    groups[s.group].label = s.group;
    pick.appendChild(groups[s.group]);
  }
  var o = document.createElement("option");
  o.value = s.id;
  o.textContent = s.title;
  groups[s.group].appendChild(o);
});

function toast(text) {
  toastEl.textContent = text;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove("on"); }, 2600);
}

// Runs inside each screen, before the page's own deferred scripts.
function hook(at) {
  return "<script>(function(){" +
    "var at=" + JSON.stringify(at || "") + ";" +
    "function up(m){try{parent.postMessage(m,'*')}catch(e){}}" +
    // The counter: show what would be counted instead of sending it.
    "function counted(body){var p=new URLSearchParams(body&&body.toString());up({proto:'count',kind:p.get('kind'),channel:p.get('channel'),place:p.get('place')});return true}" +
    "if(navigator.sendBeacon){navigator.sendBeacon=function(u,b){return counted(b)}}" +
    "var f=window.fetch;window.fetch=function(u,o){if(String(u).indexOf('/count/')>-1){counted(o&&o.body);return Promise.resolve(new Response(null,{status:204}))}return f.apply(this,arguments)};" +
    "document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var h=a.getAttribute('href');" +
    "if(/^(tel:|https:\\/\\/(wa|zalo)\\.me)/.test(h)){e.preventDefault();up({proto:'leave',href:h});return}" +
    "if(h.indexOf('/owner/')===0){e.preventDefault();up({proto:'route',href:h});return}" +
    "var m=h.match(/^\\/?#(.+)$/);if(m){var t=document.getElementById(m[1]);if(t){e.preventDefault();t.scrollIntoView({behavior:'smooth'})}return}" +
    "if(h==='/'||h.charAt(0)==='?'){e.preventDefault();up({proto:'route',href:h});return}" +
    "if(h.charAt(0)!=='/'&&!/^https?:/.test(h)){return}" +
    "if(/^https?:/.test(h)){e.preventDefault();up({proto:'leave',href:h});return}" +
    "e.preventDefault();up({proto:'route',href:h})},true);" +
    "document.addEventListener('submit',function(e){if((e.target.getAttribute('method')||'').toLowerCase()==='dialog')return;e.preventDefault();up({proto:'route',href:(e.target.getAttribute('action')||'/owner/')})},true);" +
    "if(at){var t=document.getElementById(at);if(t){t.scrollIntoView()}}" +
    "})();<\/script>";
}

function render(s) {
  var html = DOCS[s.doc].split("/static/media/").join(MEDIA);
  html = html.replace("<!--PROTO-BEFORE-DEFER-->", hook(s.at));
  view.srcdoc = html;
}

function show(id, keepWidth) {
  var s = SCENARIOS.filter(function (x) { return x.id === id; })[0] || SCENARIOS[0];
  current = s;
  pick.value = s.id;
  document.getElementById("sid").textContent = "#" + s.id;
  if (!keepWidth) setPhone(s.w === "phone", true);
  render(s);
  if (location.hash.slice(1) !== s.id) history.replaceState(null, "", location.search + "#" + s.id);
}

function setPhone(on, quiet) {
  phone = on;
  stage.classList.toggle("phone", on);
  document.getElementById("wDesk").setAttribute("aria-pressed", String(!on));
  document.getElementById("wPhone").setAttribute("aria-pressed", String(on));
  if (!quiet && current) render(current);
}

var LABEL = {call: "Call", whatsapp: "WhatsApp", zalo: "Zalo", bar: "phone bar", rent: "rent chapter", contact: "contact chapter", faq: "FAQ"};
var ROUTES = [
  [/^\/owner\/counter\/dailycount\/?$/, "counter-report"],
  [/^\/owner\/logout\/?$/, "owner-login"],
  [/^\/owner\/login\/?/, "owner-home"],
  [/^\/owner\/?$/, "owner-home"],
  [/^\/owner\/counter\/?$/, "owner-home"],
  [/^\/$/, "intro-day"]
];
var THEME = /[?&]t=(dawn|day|dusk|night)\b/;

window.addEventListener("message", function (e) {
  var m = e.data || {};
  if (m.proto === "count") {
    toast(m.kind === "view" ? "Counted: one view of the page" :
      "Counted: " + (LABEL[m.channel] || m.channel) + " pressed in the " + (LABEL[m.place] || m.place));
  } else if (m.proto === "leave") {
    toast("Would open " + m.href);
  } else if (m.proto === "route") {
    var to = THEME.test(m.href) ? "intro-" + m.href.match(THEME)[1] : null;
    ROUTES.forEach(function (r) { if (!to && r[0].test(m.href)) to = r[1]; });
    if (to) show(to, true); else toast("Not in the prototype: " + m.href);
  }
});

pick.addEventListener("change", function () { show(pick.value); });
document.getElementById("wDesk").addEventListener("click", function () { setPhone(false); });
document.getElementById("wPhone").addEventListener("click", function () { setPhone(true); });
window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });
show(location.hash.slice(1));
</script>
