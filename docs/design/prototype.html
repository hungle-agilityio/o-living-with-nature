<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ở prototype</title>
<!--
  The clickable prototype of the whole app (ADR-030): one file, every screen and state.
  Each state is an id of SCENARIOS; open it at #<id>. ?bare hides the prototype bar.
  The screens are the pages of main rendered by Django with their CSS and JS inlined
  (one-page site, owner admin, contact counts report), on demo data. No backend: contact
  links, counts and the owner's admin links act inside the prototype.
  Built from main b98e82a on 2026-11-13.
-->
<style>
:root{--bg:#f2efe8;--ink:#1d211c;--muted:#6b6f66;--line:#d9d4c8;--chip:#fffdf8;--accent:#3f5a3c;--stage:#e6e1d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a16;--ink:#ecebe4;--muted:#a3a69c;--line:#353a32;--chip:#20241f;--accent:#9cc095;--stage:#0f110e}}
:root[data-theme="dark"]{--bg:#171a16;--ink:#ecebe4;--muted:#a3a69c;--line:#353a32;--chip:#20241f;--accent:#9cc095;--stage:#0f110e}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.bar b{font-weight:600;letter-spacing:.02em}
.bar select,.bar button{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:34px}
.bar select{max-width:100%;min-width:0;flex:1 1 260px}
.bar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar code{font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.bar .note{color:var(--muted);font-size:12px;margin-left:auto}
.seg{display:inline-flex;gap:4px}
.stage{flex:1;min-height:0;display:flex;justify-content:center;background:var(--stage);overflow:auto}
iframe{border:0;background:#fff;height:100%;width:100%;display:block}
.stage.phone{padding:16px}
.stage.phone iframe{width:390px;max-width:100%;height:844px;max-height:100%;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;max-width:calc(100% - 32px);opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
body.bare .bar{display:none}
@media (max-width:600px){.bar .note{display:none}.stage.phone{padding:0}.stage.phone iframe{border-radius:0;box-shadow:none;height:100%}}
</style>
</head>
<body>
<div class="bar" id="bar">
  <b>Ở prototype</b>
  <select id="pick" aria-label="Screen and state"></select>
  <span class="seg" role="group" aria-label="Window">
    <button type="button" id="wDesk" aria-pressed="true">Desktop</button>
    <button type="button" id="wPhone" aria-pressed="false">Phone 390</button>
  </span>
  <code id="sid"></code>
  <span class="note">Demo data · pages of main, nothing is sent</span>
</div>
<div class="stage" id="stage"><iframe id="view" title="Screen"></iframe></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="application/json" id="docs">{"home-dawn": "<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Ở — Living with Nature · Garden house for rent in Hòa Xuân, Đà Nẵng<\/title>\n  <meta name=\"robots\" content=\"noindex, nofollow\">\n  <meta name=\"description\" content=\"A whole garden house with two bedrooms, rented by the month in Hòa Xuân, Đà Nẵng. From 13–14 million VND a month, minimum stay one month.\">\n  <link rel=\"canonical\" href=\"http://localhost:8000/\">\n  <meta property=\"og:title\" content=\"Ở — Living with Nature · Garden house for rent in Hòa Xuân, Đà Nẵng\">\n  <meta property=\"og:description\" content=\"A whole garden house with two bedrooms, rented by the month in Hòa Xuân, Đà Nẵng. From 13–14 million VND a month, minimum stay one month.\">\n  <meta property=\"og:url\" content=\"http://localhost:8000/\">\n  <meta property=\"og:type\" content=\"website\">\n  <meta property=\"og:site_name\" content=\"Ở — Living with Nature\">\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400&amp;family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&amp;display=swap\">\n  <style>\n/* Design E \"Through the Ở\". The values are the contract of docs/specs/site-shell/design.md. */\n\n:root {\n  /* Fonts */\n  --font-sans: \"Be Vietnam Pro\", system-ui, sans-serif;\n  --font-serif: \"Cormorant Garamond\", Georgia, serif;\n\n  /* Colours (the day theme until body[data-daypart] sets another; the footer and the contact\n     band are fixed) */\n  --ground: #f4f0e8;\n  --ink: #1f2a22;\n  --muted: #5c6358;\n  --line: #d9d2c3;\n  --paper: #f4f0e8;\n  --sand: #e9e2d3;\n  --sand-ink: #b8ae98;\n  --band: #1f2a22;\n  --chip: rgba(20, 26, 22, 0.72);\n\n  /* Type scale */\n  --size-hero: min(70vh, 105vw);\n  --size-headline: 150px;\n  --size-chapter: 200px;\n  --size-big: 84px;\n  --size-gloss: 26px;\n  --size-hero-line: 26px;\n  --size-quote: clamp(24px, 2.2vw, 30px);\n  --size-body: 16px;\n  --size-label: 11px;\n  --size-label-caps: calc(var(--size-label) / 0.7);\n  --size-wordmark: 22px;\n  --line-body: 1.7;\n  --line-headline: 0.9;\n  --spacing-headline: -0.03em;\n  --spacing-label: 0.22em;\n\n  /* Space */\n  --space-1: 8px;\n  --space-2: 16px;\n  --space-3: 24px;\n  --space-4: 32px;\n  --space-5: 48px;\n  --space-6: 64px;\n  --space-7: 136px;\n  --section-gap: 136px;\n  --content-max: 1360px;\n  --side: 40px;\n  --header-height: 64px;\n\n  /* Buttons */\n  --button-height: 48px;\n  --button-radius: 999px;\n  --button-size: 13px;\n  --button-spacing: 0.16em;\n}\n\n/* Colour themes: the time of day in Hòa Xuân (Đà Nẵng time), set by the server on body. */\n\nbody[data-daypart=\"dawn\"] {\n  --ground: #efe3d6;\n  --ink: #2b2620;\n  --muted: #5e5348;\n}\n\nbody[data-daypart=\"day\"] {\n  --ground: #f4f0e8;\n  --ink: #1f2a22;\n  --muted: #5c6358;\n}\n\nbody[data-daypart=\"dusk\"] {\n  --ground: #e4be97;\n  --ink: #2a1e16;\n  --muted: #4e3a2c;\n}\n\nbody[data-daypart=\"night\"] {\n  --ground: #151d18;\n  --ink: #e9e2d3;\n  --muted: #b9b2a2;\n  --line: rgba(233, 226, 211, 0.18);\n}\n\n*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  min-height: 100vh;\n  display: flex;\n  flex-direction: column;\n  background: var(--ground);\n  color: var(--ink);\n  font-family: var(--font-sans);\n  font-weight: 400;\n  font-size: var(--size-body);\n  line-height: var(--line-body);\n  overflow-wrap: break-word;\n  transition: background-color 0.9s ease, color 0.9s ease;\n}\n\nimg,\nvideo {\n  display: block;\n  max-width: 100%;\n  height: auto;\n}\n\na {\n  color: inherit;\n}\n\n/* Type */\n\nh1,\nh2 {\n  margin: 0;\n  font-weight: 300;\n  text-transform: uppercase;\n  letter-spacing: var(--spacing-headline);\n  line-height: var(--line-headline);\n}\n\nh1 {\n  font-size: clamp(44px, 9vw, var(--size-headline));\n}\n\nh1 em,\nh2 em,\n.accent {\n  font-family: var(--font-serif);\n  font-style: italic;\n  font-weight: 300;\n  text-transform: none;\n}\n\n.chapter-word {\n  font-family: var(--font-serif);\n  font-style: italic;\n  font-weight: 300;\n  font-size: var(--size-chapter);\n  line-height: 0.8;\n}\n\n.big {\n  font-size: var(--size-big);\n  font-weight: 300;\n  line-height: 1;\n}\n\n.gloss {\n  font-family: var(--font-serif);\n  font-weight: 300;\n  font-size: var(--size-gloss);\n}\n\n.quote {\n  font-family: var(--font-serif);\n  font-weight: 300;\n  font-size: var(--size-quote);\n}\n\n/* Labels are drawn in capitals by the font (small capitals), not by text-transform, so the\n   text of the page stays as written (\"The house\") for copying, searching and the browser\n   check. Browsers draw small capitals at about 0.7 of the font size, so --size-label-caps\n   gives capitals of --size-label. */\n.label,\n.nav-links,\n.nav-menu summary,\n.site-footer__note {\n  font-variant-caps: all-small-caps;\n  font-size: var(--size-label-caps);\n  line-height: 1.4;\n  letter-spacing: calc(var(--size-label) * 0.22);\n}\n\n.muted {\n  color: var(--muted);\n}\n\n/* Header (design-match design.md, \"Header\"): fixed to the top, a 64px row in the container.\n   As sent it is the solid bar (Paper at 94%, a Line border, Ink text): so it stays without the\n   script and under reduced motion. Over the hero of the intro it is clear (below, the flight). */\n\nbody {\n  padding-top: var(--header-height);\n}\n\n.site-header {\n  position: fixed;\n  top: 0;\n  left: 0;\n  right: 0;\n  z-index: 20;\n  padding: 0 max(var(--side), calc((100% - var(--content-max)) / 2 + var(--side)));\n  border-bottom: 1px solid var(--line);\n  background: var(--ground);\n  background: color-mix(in srgb, var(--ground) 94%, transparent);\n  color: var(--ink);\n  transition: color 0.4s ease, background-color 0.4s ease, border-color 0.4s ease;\n}\n\n.site-header__row {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: var(--space-3);\n  min-height: calc(var(--header-height) - 1px);\n}\n\n.site-header__left {\n  display: flex;\n  align-items: baseline;\n  gap: var(--space-2);\n  min-width: 0;\n}\n\n.wordmark {\n  font-family: var(--font-serif);\n  font-weight: 500;\n  font-size: var(--size-wordmark);\n  line-height: 1;\n  text-decoration: none;\n}\n\n.nav-links {\n  display: flex;\n  gap: var(--space-4);\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n\n.nav-links a {\n  display: inline-block;\n  padding: var(--space-1) 0;\n  text-decoration: none;\n}\n\n.nav-links a:hover,\n.nav-links a[aria-current=\"page\"],\n.nav-links .nav-links__contact {\n  text-decoration: underline;\n  text-underline-offset: 6px;\n}\n\n.nav-menu {\n  display: none;\n}\n\n.nav-menu summary {\n  display: inline-flex;\n  align-items: center;\n  min-height: var(--button-height);\n  padding: 0 var(--space-3);\n  border: 1px solid currentColor;\n  border-radius: var(--button-radius);\n  cursor: pointer;\n  list-style: none;\n}\n\n.nav-menu summary::-webkit-details-marker {\n  display: none;\n}\n\n.nav-menu nav {\n  position: absolute;\n  top: 100%;\n  left: 0;\n  right: 0;\n  z-index: 10;\n  padding: 0 var(--side) var(--space-2);\n  background: var(--ground);\n  border-bottom: 1px solid var(--line);\n}\n\n.nav-menu .nav-links {\n  flex-direction: column;\n  gap: 0;\n}\n\n.nav-menu .nav-links li {\n  border-top: 1px solid var(--line);\n}\n\n.nav-menu .nav-links a {\n  display: block;\n  padding: var(--space-2) 0;\n}\n\n/* Main */\n\n.site-main {\n  flex: 1;\n  width: 100%;\n  max-width: var(--content-max);\n  margin: 0 auto;\n  padding: var(--space-6) var(--side) var(--section-gap);\n}\n\n/* The one page (design-match, \"Frame\"): the main is as wide as the page and adds no space, so\n   each part sets its own width. The chapters sit in the container; the hero and the contact\n   band run full width with their text in the container (the hero and contact.css). With no\n   bottom padding, the contact band meets the footer. */\n.site-main--one-page {\n  max-width: none;\n  padding: 0;\n}\n\n/* Chapters of the one page (each chapter's own rules are in css/chapters/) */\n\n/* The container: at most 1360px, centred, with the sides (40px, 18px on phones). */\n.chapter {\n  width: min(100%, var(--content-max));\n  max-width: 100%;\n  margin-top: var(--section-gap);\n  margin-left: auto;\n  margin-right: auto;\n  padding-left: var(--side);\n  padding-right: var(--side);\n  overflow-wrap: anywhere;\n  /* The menu's jump leaves room above the marker, under the fixed header. */\n  scroll-margin-top: calc(var(--header-height) + var(--space-4));\n}\n\n/* The head: label (hook, number and gloss, 11px capitals in Stone), chapter word, h2. */\n.chapter-marker {\n  margin: 0;\n}\n\n.chapter .chapter-word {\n  margin: var(--space-2) 0 var(--space-3);\n}\n\n/* Capitals by small capitals, as the h1, so the heading text stays as written. */\n.chapter h2 {\n  margin: 0;\n  font-weight: 300;\n  text-transform: none;\n  font-variant-caps: all-small-caps;\n  /* 64px capitals on desktop, 40px on phones (one-page design.md); / 0.7 for small capitals. */\n  font-size: calc(64px / 0.7);\n  line-height: 0.9;\n  letter-spacing: var(--spacing-headline);\n}\n\n/* The accent word stays lower case at the heading's real size, as the hero's `em`. */\n.chapter h2 .accent {\n  font-variant-caps: normal;\n  font-size: 0.7em;\n}\n\n/* Footer (an Ink band in every theme) */\n\n.site-footer {\n  background: var(--band);\n  color: var(--paper);\n}\n\n.site-footer__inner {\n  max-width: var(--content-max);\n  margin: 0 auto;\n  padding: var(--space-6) var(--side);\n}\n\n.site-footer p {\n  margin: 0 0 var(--space-2);\n}\n\n.site-footer p:last-child {\n  margin-bottom: 0;\n}\n\n.site-footer__mark {\n  margin-right: var(--space-2);\n  font-family: var(--font-serif);\n  font-weight: 500;\n  font-size: var(--size-wordmark);\n}\n\n.site-footer__note {\n  opacity: 0.8;\n}\n\n/* Buttons: Ink fill on paper, Paper fill on an Ink band; the secondary is an outline. */\n\n.button {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-height: var(--button-height);\n  padding: 0 var(--space-4);\n  border: 1px solid var(--ink);\n  border-radius: var(--button-radius);\n  background: var(--ink);\n  color: var(--ground);\n  font-family: var(--font-sans);\n  font-variant-caps: all-small-caps;\n  font-size: calc(var(--button-size) / 0.7);\n  letter-spacing: calc(var(--button-size) * 0.16);\n  text-decoration: none;\n  cursor: pointer;\n}\n\n.button--secondary {\n  background: transparent;\n  color: var(--ink);\n}\n\n.band .button,\n.site-footer .button {\n  border-color: var(--paper);\n  background: var(--paper);\n  color: var(--band);\n}\n\n.band .button--secondary,\n.site-footer .button--secondary {\n  background: transparent;\n  color: var(--paper);\n}\n\n/* Media slot */\n\n.media {\n  margin: 0;\n}\n\n.media__box {\n  position: relative;\n  overflow: hidden;\n  width: 100%;\n  background: var(--sand);\n}\n\n.media img,\n.media video {\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n}\n\n.media__poster {\n  display: none;\n}\n\n.media__chip {\n  position: absolute;\n  left: var(--space-2);\n  bottom: var(--space-2);\n  padding: 6px 12px;\n  border-radius: var(--button-radius);\n  background: var(--chip);\n  color: var(--paper);\n  font-variant-caps: all-small-caps;\n  font-size: calc(10px / 0.7);\n  line-height: 1.2;\n  letter-spacing: 2.2px;\n}\n\n.media__credit {\n  margin-top: var(--space-1);\n  color: var(--muted);\n  font-size: var(--size-label);\n  letter-spacing: 0.04em;\n}\n\n.media--empty {\n  display: grid;\n  place-items: center;\n  background: var(--sand);\n  color: var(--sand-ink);\n  font-family: var(--font-serif);\n  font-weight: 500;\n  font-size: clamp(48px, 12vw, 120px);\n  line-height: 1;\n}\n\n/* Home hero \"Through the Ở\" (design.md, Components).\n\n   As sent by the server it is the still hero: the letter filled with the theme's poster photo,\n   then the dictionary line, the cue, the heading and its line, all in the page flow. The intro\n   (one screen where the letter grows by itself) exists only under the class that hero.js sets\n   on <html> when the visitor has JavaScript, the hero has its files and the visitor has not\n   asked for less motion. */\n\n/* Full width, with its text in the container (the sides at least, centred past 1360px). */\n.hero {\n  --hero-foot: 1;\n  --hero-title: 0;\n  --hero-cue: 0;\n  position: relative;\n  padding-top: var(--space-6);\n  padding-left: max(var(--side), calc((100% - var(--content-max)) / 2 + var(--side)));\n  padding-right: max(var(--side), calc((100% - var(--content-max)) / 2 + var(--side)));\n  overflow-x: clip;\n}\n\n/* The poster photo shows through the letter; with no poster the letter is Sand. */\n.hero__letter {\n  margin: 0;\n  padding-top: 0.08em;\n  text-align: center;\n  font-family: var(--font-serif);\n  font-weight: 500;\n  font-size: var(--size-hero);\n  line-height: 1;\n  color: var(--sand);\n  background-color: var(--sand);\n  background-position: center;\n  background-size: cover;\n  -webkit-background-clip: text;\n  background-clip: text;\n}\n\n@supports ((-webkit-background-clip: text) or (background-clip: text)) {\n  .hero__letter {\n    -webkit-text-fill-color: transparent;\n  }\n}\n\n/* At night the dark top of the letter would melt into the ground: a thin Paper outline. */\nbody[data-daypart=\"night\"] .hero__letter {\n  -webkit-text-stroke: 1.5px rgba(233, 226, 211, 0.55);\n}\n\n.hero__video,\n.hero__canvas,\n.hero__shade {\n  display: none;\n}\n\n/* Top right of the hero, under the header, in every state (84px from the top of the screen,\n   16px from the right; the still hero starts under the header bar). */\n.hero__chip {\n  top: calc(84px - var(--header-height));\n  right: var(--space-2);\n  left: auto;\n  bottom: auto;\n}\n\n.hero__foot {\n  margin-top: var(--space-4);\n}\n\n.hero__gloss p,\n.hero__cue {\n  margin: 0;\n}\n\n.hero__gloss {\n  line-height: 1.35;\n}\n\n.hero__cue {\n  margin-top: var(--space-3);\n}\n\n.hero__title {\n  margin-top: var(--space-6);\n}\n\n.hero__line {\n  max-width: 34em;\n  margin: var(--space-4) 0 0;\n  font-family: var(--font-serif);\n  font-weight: 300;\n  font-size: var(--size-hero-line);\n  line-height: 1.35;\n}\n\n/* The intro */\n\n/* Over the hero the header is clear; it is the solid bar again once the hero has left. */\nhtml.hero-flight body {\n  padding-top: 0;\n}\n\nhtml.hero-flight:not(.hero-past) .site-header {\n  border-bottom-color: transparent;\n  background: transparent;\n}\n\nhtml.hero-over .site-header {\n  color: var(--paper);\n}\n\n/* The open phone menu keeps its own ground, so its links keep the ink. */\nhtml.hero-over .nav-menu nav {\n  color: var(--ink);\n}\n\n/* One screen, edge to edge; its text keeps the container through .hero__foot and .hero__title. */\nhtml.hero-flight .hero {\n  height: 100vh;\n  height: 100svh;\n  min-height: 560px;\n  padding: 0;\n}\n\nhtml.hero-flight .hero__frame {\n  position: relative;\n  height: 100%;\n  overflow: hidden;\n}\n\nhtml.hero-flight .hero__chip {\n  top: 84px;\n  z-index: 3;\n}\n\n/* The canvas draws the letter; the one in the page stays for readers that do not see it. */\nhtml.hero-flight .hero__letter {\n  position: absolute;\n  top: 0;\n  left: 0;\n  right: 0;\n  opacity: 0;\n  pointer-events: none;\n}\n\nhtml.hero-flight .hero__video {\n  display: block;\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  opacity: 0;\n  pointer-events: none;\n}\n\nhtml.hero-flight .hero__canvas,\nhtml.hero-flight .hero__shade {\n  display: block;\n  position: absolute;\n  top: 0;\n  left: 0;\n  width: 100%;\n  height: 100%;\n}\n\nhtml.hero-flight .hero__shade {\n  background: linear-gradient(to top, rgba(20, 26, 22, 0.78), rgba(20, 26, 22, 0.18) 62%, rgba(20, 26, 22, 0.3));\n  opacity: var(--hero-title);\n}\n\nhtml.hero-flight .hero__foot,\nhtml.hero-flight .hero__title {\n  position: absolute;\n  left: max(var(--side), calc((100% - var(--content-max)) / 2 + var(--side)));\n  right: max(var(--side), calc((100% - var(--content-max)) / 2 + var(--side)));\n  margin: 0;\n}\n\nhtml.hero-flight .hero__foot {\n  bottom: 44px;\n  opacity: var(--hero-foot);\n}\n\nhtml.hero-flight .hero__cue {\n  position: absolute;\n  right: max(var(--side), calc((100% - var(--content-max)) / 2 + var(--side)));\n  bottom: var(--space-3);\n  margin: 0;\n  color: var(--paper);\n  opacity: var(--hero-cue);\n}\n\nhtml.hero-flight .hero__title {\n  bottom: var(--space-6);\n  color: var(--paper);\n  opacity: var(--hero-title);\n  pointer-events: none;\n}\n\n/* Two lines, \"Living\" on the left and \"with nature\" on the right, at 150px capitals (60px on\n   phones); hero.js puts each line in a .hero__ln and moves it up from hidden. */\nhtml.hero-flight .hero__title h1 {\n  display: flex;\n  flex-direction: column;\n  font-size: calc(var(--size-headline) / 0.7) !important;\n}\n\nhtml.hero-flight .hero__ln {\n  display: block;\n  overflow: hidden;\n  padding: 0.04em 0 0.06em;\n}\n\nhtml.hero-flight .hero__ln > span {\n  display: block;\n}\n\nhtml.hero-flight .hero__ln:last-child {\n  align-self: flex-end;\n}\n\n/* Phones */\n\n@media (max-width: 760px) {\n  :root {\n    --size-headline: 60px;\n    --size-chapter: 96px;\n    --size-big: 44px;\n    --size-gloss: 22px;\n    --size-hero-line: 20px;\n    --size-quote: 22px;\n    --section-gap: 72px;\n    --side: 18px;\n  }\n\n  .chapter h2 {\n    font-size: calc(40px / 0.7);\n  }\n\n  .nav-row {\n    display: none;\n  }\n\n  .nav-menu {\n    display: block;\n  }\n\n  .button {\n    width: 100%;\n  }\n}\n\n/* Reduced motion: no colour transition, no video plays, the poster photo shows instead. */\n\n@media (prefers-reduced-motion: reduce) {\n  body {\n    transition: none;\n  }\n\n  .media video {\n    display: none;\n  }\n\n  .media__poster {\n    display: block;\n  }\n}\n\n<\/style>\n  \n  <style>\n/* Chapter 01, the house (#house; design-match design.md, \"01 ở nhà\"). The shared chapter rules\n   (spacing, marker, word, heading) are in site.css. Desktop, on 12 columns: the head (columns\n   1–7) beside the owner line and \"Why Ở\" (columns 8–12, at the bottom); the room collage (18px\n   gaps, 72px below), each photo at its own height and shift; the facts row (96px below); then the\n   layout list and \"Included\" (columns 1–5) beside the walk through the house (columns 7–12).\n   Phones: one column, the collage a sideways row of 240px by 320px cards in its own box, the\n   facts row on two columns. */\n\n.chapter--house {\n  position: relative;\n}\n\n.house__top,\n.house__details {\n  display: grid;\n  grid-template-columns: repeat(12, minmax(0, 1fr));\n  gap: 24px;\n}\n\n.house__head {\n  grid-column: 1 / span 7;\n}\n\n.house__intro {\n  grid-column: 8 / span 5;\n  align-self: end;\n}\n\n.house__owner {\n  margin: 0 0 var(--space-3);\n  font-size: 28px;\n  line-height: 1.3;\n}\n\n.house__owner .accent {\n  font-style: italic;\n}\n\n.house__why {\n  margin: 0;\n  color: var(--muted);\n}\n\n/* The room collage */\n\n.house__collage {\n  display: grid;\n  grid-template-columns: repeat(12, minmax(0, 1fr));\n  gap: 18px;\n  align-items: start;\n  margin: 72px 0 0;\n  padding: 0;\n  list-style: none;\n}\n\n.house__room {\n  min-width: 0;\n}\n\n.house__room .media__box {\n  width: 100%;\n}\n\n.house__room--bedroom {\n  grid-column: 1 / 6;\n}\n\n.house__room--bedroom .media__box {\n  height: 620px;\n}\n\n.house__room--lightwell {\n  grid-column: 6 / 10;\n  margin-top: 160px;\n}\n\n.house__room--lightwell .media__box {\n  height: 460px;\n}\n\n.house__room--veranda {\n  grid-column: 10 / 13;\n  margin-top: 60px;\n}\n\n.house__room--veranda .media__box {\n  height: 340px;\n}\n\n.house__room--kitchen {\n  grid-column: 2 / 7;\n}\n\n.house__room--kitchen .media__box {\n  height: 380px;\n}\n\n.house__room--garden-evening {\n  grid-column: 8 / 13;\n  margin-top: -120px;\n}\n\n.house__room--garden-evening .media__box {\n  height: 460px;\n}\n\n.house__room-label {\n  margin: 12px 0 0;\n}\n\n/* The facts row */\n\n.house__facts {\n  display: grid;\n  grid-template-columns: repeat(4, minmax(0, 1fr));\n  gap: 24px;\n  margin: 96px 0 0;\n  padding: var(--space-3) 0 0;\n  border-top: 1px solid var(--ink);\n  list-style: none;\n}\n\n.house__fact-number {\n  display: block;\n  font-family: var(--font-serif);\n  font-weight: 300;\n  font-size: 80px;\n  line-height: 1;\n}\n\n.house__fact-label {\n  display: block;\n  margin-top: var(--space-1);\n  color: var(--muted);\n}\n\n/* The layout list, \"Included\" and the walk through the house */\n\n.house__details {\n  margin-top: 96px;\n}\n\n.house__details > div {\n  grid-column: 1 / span 5;\n}\n\n.house__layout ul {\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n\n.house__layout li {\n  padding: var(--space-2) 0;\n  border-top: 1px solid var(--line);\n}\n\n.house__included p {\n  margin: 0;\n}\n\n.house__included .label {\n  margin-top: var(--space-4);\n}\n\n.house__layout .label,\n.house__included .label {\n  margin-bottom: var(--space-2);\n}\n\n/* Walk through the house (#floor-plan): a schematic, not the real layout. Blocks in walking order\n   from the front garden to the back garden, drawn with lines only (no image file). Gardens and\n   wide rooms run across the plan; the other rooms sit two by two. */\n\n.house__plan {\n  grid-column: 7 / span 6;\n  grid-row: 1 / span 2;\n  align-self: start;\n  margin: 0;\n}\n\n.floor-plan__heading {\n  margin: 0 0 var(--space-2);\n  font-weight: inherit;\n}\n\n.floor-plan__drawing {\n  position: relative;\n  padding: var(--space-2) var(--space-2) calc(var(--space-2) + 40px);\n  border: 1px solid var(--line);\n}\n\n.floor-plan__rooms {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: var(--space-1);\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n\n.floor-plan__part--garden,\n.floor-plan__part--wide {\n  grid-column: 1 / -1;\n}\n\n.floor-plan__room {\n  display: flex;\n  align-items: center;\n  min-height: 56px;\n  height: 100%;\n  padding: var(--space-1) var(--space-2);\n  border: 1px solid var(--ink);\n  color: var(--ink);\n  font-size: var(--size-body);\n  line-height: 1.3;\n}\n\n.floor-plan__part--garden .floor-plan__room {\n  border-style: dashed;\n  border-color: var(--muted);\n  color: var(--muted);\n}\n\na.floor-plan__room {\n  background: var(--sand);\n  text-decoration: underline;\n  text-underline-offset: 3px;\n}\n\na.floor-plan__room::after {\n  content: \"↗\";\n  content: \"↗\" / \"\"; /* a mark for the eye only: screen readers skip it */\n  margin-left: auto;\n  padding-left: var(--space-1);\n  text-decoration: none;\n}\n\na.floor-plan__room:hover,\na.floor-plan__room:focus-visible {\n  border-color: var(--ink);\n  background: var(--ground);\n}\n\n.floor-plan__dialog {\n  width: min(880px, calc(100% - 2 * var(--space-2)));\n  max-height: calc(100% - 2 * var(--space-2));\n  padding: var(--space-2);\n  border: 1px solid var(--line);\n  background: var(--ground);\n  color: var(--ink);\n}\n\n.floor-plan__dialog::backdrop {\n  background: var(--chip);\n}\n\n.floor-plan__dialog .media {\n  margin: 0;\n}\n\n/* At most 70% of the screen high, so a tall photo still leaves its chip, credit and Close in\n   view; the width follows from the photo's ratio (set by the script). */\n.floor-plan__box {\n  width: min(100%, calc(70vh * var(--photo-ratio, 1.5)));\n  margin: 0 auto;\n}\n\n.floor-plan__box img {\n  display: block;\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n}\n\n.floor-plan__dialog form {\n  margin-top: var(--space-2);\n  text-align: right;\n}\n\n@media (max-width: 760px) {\n  .house__top,\n  .house__details {\n    grid-template-columns: minmax(0, 1fr);\n  }\n\n  .house__head,\n  .house__intro,\n  .house__details > div,\n  .house__plan {\n    grid-column: 1;\n    grid-row: auto;\n  }\n\n  .house__collage {\n    display: flex;\n    gap: 12px;\n    max-width: 100%;\n    margin-top: var(--space-5);\n    padding-bottom: var(--space-1);\n    overflow-x: auto;\n    overscroll-behavior-x: contain;\n    scroll-snap-type: x mandatory;\n  }\n\n  .house__room {\n    flex: 0 0 240px;\n    margin-top: 0;\n    scroll-snap-align: start;\n  }\n\n  .house__room .media__box {\n    height: 320px;\n  }\n\n  .house__facts {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n  }\n\n  .house__fact-number {\n    font-size: 56px;\n  }\n}\n\n<\/style>\n  <style>\n/* Chapter 02, Hòa Xuân (#hoa-xuan), design-match design.md \"02 ở gần\". The shared chapter rules\n   (spacing, marker, word, heading) are in site.css.\n\n   A full-width band, 100vh high and at least 680px: the area loop covers it under a veil, the\n   head sits 72px from its top, and the line and the four travel facts sit 56px from its bottom,\n   in Paper. Its text keeps the container (the sides, or centred past 1360px). Under the band,\n   48px below, in the container: three photos (4 / 3, columns of 4), then the Maps button.\n   Phones: two travel columns and one photo column. */\n\n.chapter--hoa-xuan {\n  position: relative;\n  width: 100%;\n  padding-left: 0;\n  padding-right: 0;\n}\n\n.hoa-xuan__band {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  justify-content: space-between;\n  gap: var(--space-5);\n  height: 100vh;\n  min-height: 680px;\n  padding-top: 72px;\n  padding-bottom: 56px;\n  padding-left: max(var(--side), calc((100% - var(--content-max)) / 2 + var(--side)));\n  padding-right: max(var(--side), calc((100% - var(--content-max)) / 2 + var(--side)));\n  overflow: hidden;\n  background: var(--band);\n  color: var(--paper);\n}\n\n.hoa-xuan__head,\n.hoa-xuan__foot {\n  position: relative;\n  z-index: 1;\n}\n\n/* The label is Stone on Paper; on the band it is Paper, as on the Ink band. */\n.hoa-xuan__band .chapter-marker {\n  color: var(--paper);\n}\n\n/* The loop covers the band, behind the text, under the veil. */\n.hoa-xuan__loop {\n  position: absolute;\n  inset: 0;\n  z-index: 0;\n}\n\n.hoa-xuan__loop .media {\n  position: relative;\n  height: 100%;\n}\n\n.hoa-xuan__loop .media__box {\n  height: 100%;\n}\n\n.hoa-xuan__loop .media__box::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  z-index: 1;\n  background: linear-gradient(to bottom, rgba(31, 42, 34, 0.55) 0%, rgba(31, 42, 34, 0.15) 40%, rgba(31, 42, 34, 0.72) 100%);\n  pointer-events: none;\n}\n\n.hoa-xuan__loop .media__chip {\n  z-index: 2;\n  left: auto;\n  right: max(var(--side), calc((100% - var(--content-max)) / 2 + var(--side)));\n}\n\n.hoa-xuan__loop .media__credit {\n  position: absolute;\n  left: max(var(--side), calc((100% - var(--content-max)) / 2 + var(--side)));\n  bottom: var(--space-2);\n  z-index: 2;\n  margin: 0;\n  color: var(--paper);\n  opacity: 0.8;\n}\n\n.hoa-xuan__line {\n  max-width: 34em;\n  margin: 0 0 var(--space-4);\n  font-size: 28px;\n  line-height: 1.3;\n}\n\n.hoa-xuan__travel {\n  display: grid;\n  grid-template-columns: repeat(4, minmax(0, 1fr));\n  gap: var(--space-3);\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n\n.hoa-xuan__travel li {\n  display: flex;\n  flex-direction: column;\n  padding-top: 14px;\n  border-top: 1px solid rgba(244, 240, 232, 0.6);\n}\n\n/* The \" · \" stays in the text of each row for copying and reading; it is not drawn. */\n.hoa-xuan__dot {\n  display: none;\n}\n\n.hoa-xuan__time {\n  font-family: var(--font-serif);\n  font-style: italic;\n  font-weight: 300;\n  font-size: 32px;\n  line-height: 1.2;\n}\n\n/* Under the band, in the container. */\n.hoa-xuan__after {\n  width: min(100%, var(--content-max));\n  margin: 48px auto 0;\n  padding: 0 var(--side);\n}\n\n.hoa-xuan__photos {\n  display: grid;\n  grid-template-columns: repeat(12, minmax(0, 1fr));\n  gap: 24px;\n  margin: 0 0 var(--space-5);\n  padding: 0;\n  list-style: none;\n}\n\n.hoa-xuan__photos li {\n  grid-column: span 4;\n}\n\n@media (max-width: 760px) {\n  .hoa-xuan__travel {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n  }\n\n  .hoa-xuan__time {\n    font-size: 24px;\n  }\n\n  .hoa-xuan__photos {\n    grid-template-columns: minmax(0, 1fr);\n  }\n\n  .hoa-xuan__photos li {\n    grid-column: 1;\n  }\n}\n\n<\/style>\n  <style>\n/* Chapter 03, the rent (#rent), design-match design.md \"03 ở lâu\". The shared chapter rules\n   (container, marker, word, heading) are in site.css. Desktop: a 12-column grid with 24px gaps.\n   Columns 1–6: the head, the price line in Be Vietnam Pro 300 capitals at 84px (56px under the\n   heading), the buttons (36px under it) and the terms (48px under them). Columns 8–12: the tea\n   photo, 560px high, then the owner's quote in Cormorant 24px. The photo and quote come first\n   in the source; on phones (one column) they move under the terms, the photo at 4 / 5.\n   The buttons themselves are in contact.css. */\n\n.chapter--rent {\n  position: relative;\n}\n\n.rent__grid {\n  display: grid;\n  grid-template-columns: repeat(12, minmax(0, 1fr));\n  gap: 24px;\n  align-items: start;\n}\n\n.rent__price {\n  grid-column: 1 / span 6;\n  grid-row: 1;\n}\n\n.rent__aside {\n  grid-column: 8 / span 5;\n  grid-row: 1;\n  display: flex;\n  flex-direction: column;\n  gap: 22px;\n}\n\n/* 84px capitals drawn as small capitals (so the text stays as written): 84 / 0.7. The line\n   height is 0.95 of the 84px capitals. The accent words stay lower case at their real size. */\n.rent__line {\n  margin: 56px 0 0;\n  font-family: var(--font-sans);\n  font-weight: 300;\n  font-variant-caps: all-small-caps;\n  font-size: calc(var(--size-big) / 0.7);\n  line-height: calc(var(--size-big) * 0.95);\n  letter-spacing: var(--spacing-headline);\n}\n\n.rent__line .accent {\n  font-variant-caps: normal;\n  font-size: 0.7em;\n}\n\n.rent__buttons {\n  margin-top: 36px;\n}\n\n.rent__terms-block {\n  margin-top: var(--space-5);\n}\n\n.rent__terms {\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n\n.rent__terms li {\n  padding: var(--space-2) 0;\n  border-top: 1px solid var(--line);\n}\n\n.rent__photo .media__box {\n  height: 560px;\n}\n\n.rent__quote {\n  margin: 0;\n}\n\n.rent__quote blockquote {\n  margin: 0;\n  font-family: var(--font-serif);\n  font-weight: 300;\n  font-size: 24px;\n  line-height: 1.35;\n}\n\n.rent__quote blockquote p {\n  margin: 0;\n}\n\n.rent__quote figcaption {\n  margin-top: var(--space-1);\n}\n\n@media (max-width: 760px) {\n  .rent__grid {\n    grid-template-columns: minmax(0, 1fr);\n  }\n\n  .rent__price,\n  .rent__aside {\n    grid-column: 1;\n    grid-row: auto;\n  }\n\n  .rent__aside {\n    order: 1;\n    margin-top: var(--space-5);\n  }\n\n  .rent__photo .media__box {\n    height: auto;\n  }\n}\n\n<\/style>\n  <style>\n/* Chapter 04, FAQ (#faq). It has no chapter word; its heading \"FAQ\" is drawn at 150px on\n   desktop and 60px on phones (design.md), / 0.7 for small capitals.\n\n   Two columns (issue #83): a 12-column grid with 40px gaps. The side block (columns 1–4) holds\n   the head, a Line rule, the owner's line and the contact buttons, and stays in place while the\n   questions (columns 6–12) scroll. Each question is a row with a \"+\" (closed) or \"–\" (open) in\n   Cormorant on the right; the details element opens and closes on its own, with no script, and\n   name=\"faq\" keeps one open at a time. On phones the chapter is one column: head, questions,\n   then the owner's line and the buttons. */\n\n.chapter--faq h2 {\n  margin-top: var(--space-4);\n  font-size: calc(150px / 0.7);\n  line-height: 0.63;\n  letter-spacing: -0.021em;\n}\n\n.chapter--faq {\n  display: grid;\n  grid-template-columns: repeat(12, minmax(0, 1fr));\n  column-gap: 40px;\n  align-items: start;\n}\n\n.faq-side {\n  grid-column: 1 / 5;\n  position: sticky;\n  top: 96px;\n  min-width: 0;\n}\n\n/* The narrow side column (about 250px at 900px wide) is less wide than the 150px heading:\n   the word never breaks (\"FA/Q\") and may reach over the empty column 5 instead. */\n.faq-side h2 {\n  white-space: nowrap;\n  overflow-wrap: normal;\n}\n\n.faq-side__invite {\n  margin-top: var(--space-6);\n  padding-top: var(--space-4);\n  border-top: 1px solid var(--line);\n}\n\n.faq-side__line {\n  margin: 0 0 var(--space-4);\n  font-family: var(--font-serif);\n  font-weight: 300;\n  font-size: 26px;\n  line-height: 1.3;\n}\n\n.faq-side__line:last-child {\n  margin-bottom: 0;\n}\n\n.faq-list {\n  grid-column: 6 / 13;\n  min-width: 0;\n  border-top: 1px solid var(--line);\n}\n\n.faq-item {\n  border-bottom: 1px solid var(--line);\n}\n\n.faq-item summary {\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: var(--space-3);\n  padding: var(--space-3) 0;\n  cursor: pointer;\n  list-style: none;\n  font-family: var(--font-serif);\n  font-weight: 300;\n  font-size: 30px;\n  line-height: 1.2;\n}\n\n.faq-item summary::-webkit-details-marker {\n  display: none;\n}\n\n.faq-item summary::after {\n  content: \"+\";\n  flex: none;\n  font-family: var(--font-serif);\n  font-size: 32px;\n  line-height: 1;\n}\n\n.faq-item[open] > summary::after {\n  content: \"–\";\n}\n\n.faq-item summary:focus-visible {\n  outline: 2px solid currentColor;\n  outline-offset: 4px;\n}\n\n.faq-item p {\n  margin: 0 0 var(--space-3);\n  max-width: 56ch;\n  color: var(--muted);\n  line-height: var(--line-body);\n}\n\n@media (max-width: 760px) {\n  .chapter--faq h2 {\n    font-size: calc(60px / 0.7);\n  }\n\n  /* One column; the side block lets its two parts take their own places around the list. */\n  .chapter--faq {\n    display: flex;\n    flex-direction: column;\n  }\n\n  .faq-side {\n    display: contents;\n  }\n\n  .faq-side__head {\n    order: 1;\n  }\n\n  .faq-list {\n    order: 2;\n    min-width: 0;\n    margin-top: var(--space-5);\n  }\n\n  .faq-side__invite {\n    order: 3;\n    margin-top: var(--space-5);\n  }\n\n  .faq-item summary {\n    font-size: 22px;\n  }\n}\n\n<\/style>\n  <style>\n/* Chapter 05, contact (#contact), the contact buttons and the phone contact bar. The shared\n   chapter rules (spacing, marker, word, heading) are in site.css.\n\n   Contact is the Ink band of design.md: full width, Paper text, the Call button in Paper fill\n   (site.css, \".band .button\") and the others as outlines. The band is as wide as the page\n   (the one-page main has no sides) and keeps its text in the container with its own padding:\n   the sides, or centred past 1360px. It is the last part of the page, so it meets the footer. */\n\n.chapter--contact {\n  position: relative;\n  width: 100%;\n  padding-top: 128px;\n  padding-bottom: 112px;\n  padding-left: max(var(--side), calc((100% - var(--content-max)) / 2 + var(--side)));\n  padding-right: max(var(--side), calc((100% - var(--content-max)) / 2 + var(--side)));\n  background: var(--band);\n  color: var(--paper);\n}\n\n/* One row that wraps (design-match design.md, \"05 ở lại?\"): on the left the heading and the\n   owner's line, on the right the buttons, both resting on the bottom of the row. */\n.contact__row {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: space-between;\n  align-items: flex-end;\n  gap: 28px;\n  margin-top: var(--space-4);\n}\n\n.contact__line {\n  max-width: 640px;\n  margin: 20px 0 0;\n  font-family: var(--font-serif);\n  font-weight: 300;\n  font-size: 30px;\n  line-height: 1.3;\n}\n\n.contact__empty {\n  margin: 0;\n}\n\n/* The buttons (includes/contact_buttons.html) */\n\n.contact-buttons {\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--space-2);\n}\n\n/* The phone contact bar: Ink at 96%, three equal 44px pills, above the phone's home bar. It\n   exists only at 760px or less. Without JavaScript it always shows there; contact-bar.js adds\n   \"contact-bar--away\" while the hero or the contact chapter is on screen. */\n\n.contact-bar {\n  display: none;\n}\n\n@media (max-width: 760px) {\n  .contact-bar {\n    position: fixed;\n    right: 0;\n    bottom: 0;\n    left: 0;\n    z-index: 20;\n    display: block;\n    padding: var(--space-1) var(--side) calc(var(--space-1) + env(safe-area-inset-bottom, 0px));\n    background: rgba(31, 42, 34, 0.96);\n    transition: transform 0.3s ease;\n  }\n\n  .contact-bar--away {\n    transform: translateY(110%);\n  }\n\n  .contact-bar .contact-buttons {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(0, 1fr));\n    gap: var(--space-1);\n  }\n\n  .contact-bar .button {\n    min-height: 44px;\n    padding: 0 var(--space-1);\n    border-color: var(--paper);\n    background: transparent;\n    color: var(--paper);\n  }\n\n  .contact-bar .button:not(.button--secondary) {\n    background: var(--paper);\n    color: var(--band);\n  }\n\n  /* Room under the footer, so the bar never covers its last line. */\n  body:has(.contact-bar) {\n    padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .contact-bar {\n    transition: none;\n  }\n}\n\n<\/style>\n\n  <style>\n/* Load and reveal motion (design.md, \"Load and reveal motion\").\n\n   Every rule needs the class \"motion\" on <html>, set by js/reveal.js only when the visitor has\n   not asked for less motion. Without the script, or under reduced motion, everything shows at\n   once, with no transform and no animation. */\n\n@media (prefers-reduced-motion: no-preference) {\n  /* The header fades in and moves 12px down into place. \"backwards\" leaves no end state, so the\n     hero script can still move the header once this is done. */\n  html.motion .site-header {\n    animation: motion-header-in 0.9s ease-out 0.2s backwards;\n  }\n\n  @keyframes motion-header-in {\n    from {\n      opacity: 0;\n      transform: translateY(-12px);\n    }\n\n    to {\n      opacity: 1;\n      transform: none;\n    }\n  }\n\n  /* A block of a chapter waits 42px lower, hidden, until 12% of it is on screen. */\n  html.motion .reveal {\n    opacity: 0;\n    transform: translateY(42px);\n    transition:\n      opacity 1.1s cubic-bezier(0.2, 0.7, 0.2, 1),\n      transform 1.1s cubic-bezier(0.2, 0.7, 0.2, 1);\n  }\n\n  html.motion .reveal.is-revealed {\n    opacity: 1;\n    transform: none;\n  }\n\n  /* On screen when the page opens: shown at once. */\n  html.motion .reveal.is-revealed-now {\n    transition: none;\n  }\n\n  /* Photos in media slots zoom slowly, clipped by the slot (overflow: hidden in site.css). */\n  html.motion .media__box img {\n    animation: motion-zoom 22s ease-in-out infinite alternate;\n  }\n\n  @keyframes motion-zoom {\n    from {\n      transform: scale(1.02);\n    }\n\n    to {\n      transform: scale(1.09);\n    }\n  }\n}\n\n<\/style>\n  \n  \n<\/head>\n<body data-daypart=\"dawn\">\n  <header class=\"site-header\">\n  <div class=\"site-header__row\">\n    <div class=\"site-header__left\">\n      <a class=\"wordmark\" href=\"/\">Ở<\/a>\n      <span class=\"site-header__time label\" data-now=\"1794556347606\" data-preview>It's 14:52 in Hòa Xuân · Dawn<\/span>\n    <\/div>\n    <nav class=\"nav-row\" aria-label=\"Main\">\n      <ul class=\"nav-links\">\n  <li><a href=\"/#house\">The house<\/a><\/li>\n  <li><a href=\"/#hoa-xuan\">Hòa Xuân<\/a><\/li>\n  <li><a href=\"/#rent\">Rent<\/a><\/li>\n  <li><a href=\"/#faq\">FAQ<\/a><\/li>\n  <li><a href=\"/#contact\" class=\"nav-links__contact\">Contact<\/a><\/li>\n<\/ul>\n\n    <\/nav>\n    <details class=\"nav-menu\">\n      <summary>Menu<\/summary>\n      <nav aria-label=\"Menu\">\n        <ul class=\"nav-links\">\n  <li><a href=\"/#house\">The house<\/a><\/li>\n  <li><a href=\"/#hoa-xuan\">Hòa Xuân<\/a><\/li>\n  <li><a href=\"/#rent\">Rent<\/a><\/li>\n  <li><a href=\"/#faq\">FAQ<\/a><\/li>\n  <li><a href=\"/#contact\" class=\"nav-links__contact\">Contact<\/a><\/li>\n<\/ul>\n\n      <\/nav>\n    <\/details>\n  <\/div>\n<\/header>\n\n  <main class=\"site-main site-main--one-page\">\n<section id=\"hero\" class=\"hero\" data-loop-dawn=\"/static/media/hero/dawn.jpg /static \n\n\n\n<section id=\"house\" class=\"chapter chapter--house\" aria-labelledby=\"house-heading\">\n  <div class=\"house__top\">\n    <div class=\"house__head\">\n      <p class=\"chapter-marker label muted\">&nbsp;&#x309; 01 · at home<\/p>\n      <p class=\"chapter-word\" lang=\"vi\">ở nhà<\/p>\n      <h2 id=\"house-heading\">The <span class=\"accent\">house<\/span><\/h2>\n    <\/div>\n    <div class=\"house__intro\">\n      <p class=\"house__owner quote reveal\">Hi, I&#x27;m Bún. I built a small garden house in Hòa Xuân, and I'd love for someone to make it <span class=\"accent\">home for a while.<\/span><\/p>\n      <p class=\"house__why reveal\">I wanted a house that feels good to live in every day, not just in photos: a little garden, morning light, a veranda to sit on. Ở is that house.<\/p>\n    <\/div>\n  <\/div>\n\n  <ul class=\"house__collage\">\n    <li class=\"house__room house__room--bedroom reveal\"><figure class=\"media\">\n\n  <div class=\"media__box\" style=\"aspect-ratio: 4 / 5\">\n    <img src=\"/static/media/photos/bedroom.jpg\" alt=\"A calm bedroom with a made bed\" width=\"1600\" height=\"1067\">\n    <span class=\"media__chip\">Illustrative photo<\/span>\n  <\/div>\n  <figcaption class=\"media__credit\">Photo: Pexels<\/figcaption>\n\n<\/figure>\n<p class=\"house__room-label label\">Bedrooms · two<\/p><\/li>\n    <li class=\"house__room house__room--lightwell reveal\"><figure class=\"media\">\n\n  <div class=\"media__box\" style=\"aspect-ratio: 3 / 4\">\n    <img src=\"/static/media/photos/lightwell.jpg\" alt=\"An indoor atrium with hanging plants under a skylight\" width=\"1200\" height=\"1600\" loading=\"lazy\">\n    <span class=\"media__chip\">Illustrative photo<\/span>\n  <\/div>\n  <figcaption class=\"media__credit\">Photo: Fatmanur Üzüm / Pexels<\/figcaption>\n\n<\/figure>\n<p class=\"house__room-label label\">Light well<\/p><\/li>\n    <li class=\"house__room house__room--veranda reveal\"><figure class=\"media\">\n\n  <div class=\"media__box\" style=\"aspect-ratio: 3 / 4\">\n    <img src=\"/static/media/photos/veranda.jpg\" alt=\"A shaded back veranda with wicker chairs and tropical plants\" width=\"1600\" height=\"1060\" loading=\"lazy\">\n    <span class=\"media__chip\">Illustrative photo<\/span>\n  <\/div>\n  <figcaption class=\"media__credit\">Photo: Pexels<\/figcaption>\n\n<\/figure>\n<p class=\"house__room-label label\">Veranda<\/p><\/li>\n    <li class=\"house__room house__room--kitchen reveal\"><figure class=\"media\">\n\n  <div class=\"media__box\" style=\"aspect-ratio: 4 / 3\">\n    <img src=\"/static/media/photos/kitchen.jpg\" alt=\"A sunlit kitchen with wooden furniture\" width=\"901\" height=\"1600\" loading=\"lazy\">\n    <span class=\"media__chip\">Illustrative photo<\/span>\n  <\/div>\n  <figcaption class=\"media__credit\">Photo: Pexels<\/figcaption>\n\n<\/figure>\n<p class=\"house__room-label label\">Living &amp; kitchen<\/p><\/li>\n    <li class=\"house__room house__room--garden-evening reveal\"><figure class=\"media\">\n\n  <div class=\"media__box\" style=\"aspect-ratio: 4 / 3\">\n    <img src=\"/static/media/photos/garden-evening.jpg\" alt=\"String lights in a garden in the evening\" width=\"1067\" height=\"1600\" loading=\"lazy\">\n    <span class=\"media__chip\">Illustrative photo<\/span>\n  <\/div>\n  <figcaption class=\"media__credit\">Photo: CharlieBrown / Pexels<\/figcaption>\n\n<\/figure>\n<p class=\"house__room-label label\">Back garden<\/p><\/li>\n  <\/ul>\n\n  <ul class=\"house__facts reveal\">\n    <li><span class=\"house__fact-number\">2<\/span> <span class=\"house__fact-label\">bedrooms<\/span><\/li>\n    <li><span class=\"house__fact-number\">2<\/span> <span class=\"house__fact-label\">gardens<\/span><\/li>\n    <li><span class=\"house__fact-number\">1<\/span> <span class=\"house__fact-label\">light well<\/span><\/li>\n    <li><span class=\"house__fact-number\">1<\/span> <span class=\"house__fact-label\">household at a time<\/span><\/li>\n  <\/ul>\n\n  <div class=\"house__details\">\n    <div class=\"house__layout reveal\">\n      <p class=\"label muted\">The layout<\/p>\n      <ul>\n        <li>Two bedrooms<\/li>\n        <li>One bathroom<\/li>\n        <li>Living room and kitchen<\/li>\n        <li>Mezzanine<\/li>\n        <li>Light well<\/li>\n        <li>Front and back gardens<\/li>\n        <li>Covered veranda<\/li>\n        <li>Laundry, drying and storage area<\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"house__included reveal\">\n      <p class=\"label muted\">Included<\/p>\n      <p>Basic furniture. Garden care once a week. Cleaning can be arranged.<\/p>\n    <\/div>\n    <figure id=\"floor-plan\" class=\"house__plan floor-plan reveal\" aria-labelledby=\"floor-plan-heading\">\n  <h3 id=\"floor-plan-heading\" class=\"label muted floor-plan__heading\">Walk through the house<\/h3>\n  <div class=\"floor-plan__drawing\">\n    <ol class=\"floor-plan__rooms\">\n      <li class=\"floor-plan__part floor-plan__part--garden\"><span class=\"floor-plan__room\">Front garden<\/span><\/li>\n      <li class=\"floor-plan__part floor-plan__part--wide\"><a class=\"floor-plan__room\" href=\"/static/media/photos/kitchen.jpg\" data-alt=\"A sunlit kitchen with wooden furniture\" data-credit=\"Photo: Pexels\" data-width=\"901\" data-height=\"1600\" data-illustrative>Living room and kitchen<\/a><\/li>\n      <li class=\"floor-plan__part floor-plan__part--room\"><a class=\"floor-plan__room\" href=\"/static/media/photos/lightwell.jpg\" data-alt=\"An indoor atrium with hanging plants under a skylight\" data-credit=\"Photo: Fatmanur Üzüm / Pexels\" data-width=\"1200\" data-height=\"1600\" data-illustrative>Light well<\/a><\/li>\n      <li class=\"floor-plan__part floor-plan__part--room\"><a class=\"floor-plan__room\" href=\"/static/media/photos/bedroom.jpg\" data-alt=\"A calm bedroom with a made bed\" data-credit=\"Photo: Pexels\" data-width=\"1600\" data-height=\"1067\" data-illustrative>Bedroom 1<\/a><\/li>\n      <li class=\"floor-plan__part
