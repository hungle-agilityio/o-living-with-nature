# The project values of the flow, read by ops/flow_config.py. No key has a default.

[project]
repo = "hungle-agilityio/o-living-with-nature"
owner = "hungle-agilityio"
app_dir = "."
display_name = "\u1ede \u2014 Living with Nature"
slug = "o-living"

[loop]
state_dir = "~/.o-living"
tmux_session = "o-living-loop"
launchd_label = "com.o-living.loop"
setup_command = ["uv", "sync", "--frozen"]
alone_words = []

[checks]
commands = [
    ["uv", "run", "ruff", "check", "."],
    ["uv", "run", "mypy", "."],
    ["uv", "run", "pytest", "-q", "--no-cov", "-p", "no:cacheprovider"],
]
ci_workflow = "Checks"
protected_test_dirs = ["tests"]

[release]
timezone = "Asia/Ho_Chi_Minh"
deploy_line = ""

[plugin]
id = "agent-flow@o-living"
marketplace = "o-living"
