{% extends "base.html" %}
{% block content %}
{# The inner page heading of design.md: the chapter marker (the hook of ở, then the number), no chapter word for FAQ, the h1. #}
<p class="chapter-marker muted" style="margin: 0 0 var(--space-4); font-family: var(--font-serif); font-size: 28px; line-height: 1">&nbsp;&#x309; 03</p>
{# Capitals by small capitals, as the labels in site.css, so the page text stays as written. #}
<h1 style="text-transform: none; font-variant-caps: all-small-caps; font-size: calc(clamp(44px, 9vw, var(--size-headline)) / 0.7); line-height: 0.63; letter-spacing: -0.021em">FAQ</h1>
{% endblock %}
