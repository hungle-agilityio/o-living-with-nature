name: Checks

on:
  push:
    branches: [main, deploy]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv==0.5.30
      - name: Install the locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy .
      - name: App tests with coverage
        run: uv run pytest -q
      - name: Plugin and skill tests
        run: uv run pytest plugins/agent-flow .claude/skills -q --no-cov -p no:cacheprovider
      - name: Plugin version is bumped when the plugin changes
        if: github.event_name == 'pull_request'
        run: uv run python ops/check_plugin_version.py "${{ github.event.pull_request.base.sha }}" HEAD
